name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'cime-v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run make:win

      - name: Verify secrets are excluded
        shell: pwsh
        run: |
          $asar = "out/CimePalDonationBridge-win32-x64/resources/app.asar"
          if (-not (Test-Path $asar)) { throw "Packaged app.asar was not found." }
          $blocked = npx asar list $asar | Select-String '^/(\.env(?:\..*)?|worker(?:/|$)|docs(?:/|$)|\.github(?:/|$))'
          if ($blocked) { throw "Sensitive development files were included in app.asar: $blocked" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CimePalDonationBridge-Windows
          path: |
            out/make/squirrel.windows/x64/*.exe
            out/make/squirrel.windows/x64/*.nupkg
            out/make/squirrel.windows/x64/RELEASES
          if-no-files-found: error

      - name: Publish installer release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem "out/make/squirrel.windows/x64/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not found." }
          $releaseFile = Join-Path $env:RUNNER_TEMP "CimePalDonationBridge-Setup.exe"
          Copy-Item $installer.FullName $releaseFile
          gh release create $env:GITHUB_REF_NAME $releaseFile --title "씨미 팰 후원 브리지 $env:GITHUB_REF_NAME" --notes "Windows 테스트용 설치 파일입니다. CimePalDonationBridge-Setup.exe 하나만 내려받아 실행하세요." --prerelease
