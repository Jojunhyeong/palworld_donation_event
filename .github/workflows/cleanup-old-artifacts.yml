name: Remove unsafe build artifacts

on:
  push:
    branches:
      - main

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete artifacts built before the packaging fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/8311749670
          gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/8311642794
          gh api --method DELETE repos/${{ github.repository }}/actions/artifacts/8307056855
